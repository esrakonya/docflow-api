<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>docFlow — Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f5f5f7; margin: 0; }
        header { background: #111; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header form { margin: 0; }
        header button { background: none; border: 1px solid #555; color: #fff; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; }
        main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .stat-card { background: #fff; border-radius: 10px; padding: 1.25rem; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
        .stat-card .label { font-size: 0.8rem; color: #777; margin-bottom: 0.4rem; }
        .stat-card .value { font-size: 1.6rem; font-weight: 600; }
    </style>
</head>
<body>
<header>
    <span th:text="${companyName}">Company</span>
    <form th:action="@{/dashboard/logout-page}" method="post">
        <button type="submit">Sign out</button>
    </form>
</header>
<main>
    <h1>Usage overview</h1>
    <div class="stats">
        <div class="stat-card">
            <div class="label">Plan</div>
            <div class="value" th:text="${usage.planName}">FREE</div>
        </div>
        <div class="stat-card">
            <div class="label">Used credits</div>
            <div class="value" th:text="${usage.usedCredits}">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Remaining</div>
            <div class="value" th:text="${usage.remainingCredits}">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Monthly limit</div>
            <div class="value" th:text="${usage.monthlyLimit}">0</div>
        </div>
    </div>
</main>
</body>
</html>
