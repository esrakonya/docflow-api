<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>docFlow - Sign in</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f5f5f7; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 360px; }
        h1 { font-size: 1.25rem; margin: 0 0 1.5rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.35rem; color: #444; }
        input[type=text] { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        button { width: 100%; margin-top: 1.25rem; padding: 0.65rem; background: #111; color: #fff; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; }
        .error { background: #fee; color: #900; padding: 0.6rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>Sign in to docFlow</h1>
    <div class="error" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/dashboard/login}" method="post">
        <label for="apiKey">API Key</label>
        <input type="text" id="apiKey" name="apiKey" placeholder="invox_live_..." autocomplete="off" required>
        <button type="submit">Sign in</button>
    </form>
</div>
</body>
</html>
