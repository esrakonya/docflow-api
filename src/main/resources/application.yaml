app:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}

storage:
  type: ${STORAGE_TYPE}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET}

spring:
  application:
    name: docflow-api

  threads:
    virtual:
      enabled: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-6

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      observation-enabled: true
    consumer:
      group-id: docflow-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      observation-enabled: true
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: "io.docflow.api.core.document.dto.DocumentUploadedEvent"
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "io.docflow.api.*,java.util,java.lang"

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}


springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    org.flywaydb: INFO
    io.docflow.api: INFO
  pattern:
    level: "%5p [docflow-api,%X{traceId:-},%X{spanId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, tracing
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"

docflow:
   ai:
     provider: ${AI_PROVIDER}
   security:
     jwt:
       secret: ${JWT_SECRET}
       expiration-ms: 86400000
---

spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://docflow-db:5432/docflow_db
  kafka:
    bootstrap-servers: docflow-kafka:9092
  data:
    redis:
      host: docflow-redis
