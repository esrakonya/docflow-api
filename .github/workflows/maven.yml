steps:
  - uses: actions/checkout@v4

  - name: Set up JDK 21
    uses: actions/setup-java@v4
    with:
      java-version: '21'
      distribution: 'temurin'
      cache: maven

  - name: Build with Maven
    run: mvn -B package --file pom.xml
    env:
      ADMIN_USERNAME: test-admin
      ADMIN_PASSWORD: test-password123
      JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmctZm9yLWhtYWMtc2hh
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: test-key
      MINIO_SECRET_KEY: test-secret
      MINIO_BUCKET: test-bucket
      DB_URL: jdbc:postgresql://localhost:5432/docflow_db
      DB_USERNAME: user
      DB_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      AI_PROVIDER: anthropic
      GEMINI_API_KEY: dummy
      ANTHROPIC_API_KEY: dummy
      SPRING_TESTCONTAINERS_DYNAMIC_PROPERTY_REGISTRY_INJECTION: allow