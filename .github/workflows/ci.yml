name: docFlow CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml
        env:
          ADMIN_USERNAME: test-admin
          ADMIN_PASSWORD: test-password123
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: dummy
          MINIO_SECRET_KEY: dummy
          MINIO_BUCKET: invoices
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmctZm9yLWhtYWMtc2hh
          STORAGE_TYPE: local
          AI_PROVIDER: anthropic
          GEMINI_API_KEY: dummy
          ANTHROPIC_API_KEY: dummy
          STRIPE_SECRET_KEY: sk_test_test_purpose_only
          STRIPE_WEBHOOK_SECRET: whsec_test_purpose_only
          STRIPE_SUCCESS_URL: http://test-server/payment/success
          STRIPE_CANCEL_URL: http://test-server/payment/cancel
          SPRING_TESTCONTAINERS_DYNAMIC_PROPERTY_REGISTRY_INJECTION: allow